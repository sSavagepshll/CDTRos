services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COOKIE_SECURE: "1"
      HSTS_ENABLED: "0"
      UPLOAD_FOLDER: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16M,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  https_proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:443"
    depends_on:
      - app
    volumes:
      - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/portfolio.crt:/etc/nginx/certs/portfolio.crt:ro
      - ./tls/portfolio.key:/etc/nginx/certs/portfolio.key:ro
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  uploads:
